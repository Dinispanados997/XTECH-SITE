[build]
  publish = "public"
  functions = "netlify/functions"
  # põe o endereço real do site (URL do Netlify ou o teu domínio) nas tags de partilha, robots e sitemap
  command = "sed -i \"s#__SITE_URL__#${SITE_URL:-$URL}#g\" public/index.html public/robots.txt public/sitemap.xml"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
