# O site mudou-se para o Vercel (https://xtechsite.vercel.app) — ver vercel.json.
# Este ficheiro só existe para que o antigo endereço do Netlify (xtechstore.netlify.app)
# reencaminhe tudo para o site novo, mesmo que o Netlify volte a publicar a partir do GitHub.
[build]
  publish = "public"
  command = ""
  functions = "netlify/sem-funcoes"   # de propósito: no Netlify não corre nenhuma função

[[redirects]]
  from = "/*"
  to = "https://xtechsite.vercel.app/:splat"
  status = 301
  force = true
